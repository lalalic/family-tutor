<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Family Tutor</title>
<style>
  :root{
    color-scheme:light;
    --ink:#17211f;
    --muted:#6b7471;
    --line:#e5e9e7;
    --brand:#14848d;
    --brand-soft:#eaf6f6;
    --green:#22c55e;
    --amber:#f59e0b;
    --red:#ef4444;
    --gray:#6b7280;
    --soft:#f6f8f7;
  }
  *{box-sizing:border-box}
  body{width:340px;margin:0;background:#fff;color:var(--ink);font:13px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  button,input{font:inherit}
  .shell{padding:16px}
  .header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:750}
  .brand strong{font-size:14px}
  .status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--gray)}
  .dot.connected{background:var(--green)}
  .dot.recovering{background:var(--amber)}
  .dot.error{background:var(--red)}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
  .section-head strong{font-size:13px}
  .count{color:var(--muted);font-size:11px}
  .kids{border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:340px;overflow-y:auto}
  .kid{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
  .kid:last-child{border-bottom:0}
  .kid-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .actions{display:flex;align-items:center;gap:4px}
  .icon-btn{width:30px;height:30px;border:0;border-radius:8px;background:transparent;cursor:pointer;display:grid;place-items:center;font-size:16px}
  .icon-btn:hover{background:var(--soft)}
  .icon-btn:disabled{cursor:default;opacity:.55}
  .linked{color:var(--green);font-weight:800}
  .previously-linked{background:var(--brand-soft);color:var(--brand)}
  .add-link{display:inline-flex;margin-top:10px;border:0;background:transparent;color:var(--brand);padding:0;cursor:pointer;font-weight:650}
  .add-form{display:none;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;margin-top:10px}
  .add-form.show{display:grid}
  .add-form input{min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 9px;outline:none}
  .add-form input:focus{border-color:var(--brand)}
  .small-btn{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 9px;cursor:pointer}
  .small-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .notice{display:none;margin-top:10px;padding:9px 10px;border-radius:9px;background:var(--soft);color:var(--muted);font-size:11px}
  .notice.show{display:block}
  .notice.error{background:#fff1f2;color:#991b1b}
  .reconnect{width:100%;margin-top:10px;border:0;border-radius:9px;background:var(--brand);color:#fff;padding:9px;cursor:pointer}
  .footer{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:12px}
  .empty{padding:18px 12px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="brand"><div class="brand-mark">FT</div><strong>Family Tutor</strong></div>
    <div class="status"><span id="status-dot" class="dot"></span><span id="status-label">Checking</span></div>
  </div>

  <div class="section-head">
    <strong>Kids</strong>
    <span id="kid-count" class="count"></span>
  </div>
  <div id="children" class="kids"></div>

  <button id="add-kid-link" class="add-link" type="button">＋ Add kid</button>
  <div id="add-form" class="add-form">
    <input id="kid-name" maxlength="80" autocomplete="off" placeholder="Kid name">
    <button id="save-kid" class="small-btn primary" type="button">Add</button>
    <button id="cancel-add" class="small-btn" type="button">Cancel</button>
  </div>

  <div id="notice" class="notice"></div>
  <button id="reconnect" class="reconnect" hidden>Reconnect</button>

  <div class="footer">
    <span id="version"></span>
    <span id="recovery"></span>
  </div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
