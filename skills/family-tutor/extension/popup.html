<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Family Tutor</title>
<style>
  :root {
    color-scheme: light;
    --ink: #17211f;
    --muted: #6b7471;
    --line: #e5e9e7;
    --surface: #ffffff;
    --soft: #f6f8f7;
    --brand: #14848d;
    --brand-soft: #eaf6f6;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
    --gray: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    width: 360px;
    margin: 0;
    color: var(--ink);
    background: var(--surface);
    font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  button { font: inherit; }
  .shell { padding: 16px; }
  .header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-mark { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--brand); color:#fff; font-weight:750; letter-spacing:-.02em; }
  .brand-copy strong { display:block; font-size:14px; }
  .brand-copy span { display:block; color:var(--muted); font-size:11px; margin-top:1px; }
  .status-pill { display:flex; align-items:center; gap:6px; padding:6px 9px; border:1px solid var(--line); border-radius:999px; font-size:11px; color:var(--muted); white-space:nowrap; }
  .status-dot { width:8px; height:8px; border-radius:50%; background:var(--gray); }
  .status-dot.connected { background:var(--green); }
  .status-dot.recovering { background:var(--amber); }
  .status-dot.error { background:var(--red); }
  .card { border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; background:#fff; }
  .eyebrow { color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
  .project-title { font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .project-id { color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
  .section-head { display:flex; align-items:center; justify-content:space-between; margin:16px 0 8px; }
  .section-head strong { font-size:13px; }
  .summary { color:var(--muted); font-size:11px; }
  .kids { border:1px solid var(--line); border-radius:12px; overflow:hidden; max-height:330px; overflow-y:auto; background:#fff; }
  .kid { display:grid; grid-template-columns:34px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 11px; border-bottom:1px solid var(--line); }
  .kid:last-child { border-bottom:0; }
  .avatar { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--brand-soft); color:var(--brand); font-weight:750; text-transform:uppercase; }
  .kid-copy { min-width:0; }
  .kid-name { font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kid-state { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .kid-actions { display:flex; align-items:center; gap:6px; }
  .primary, .secondary, .link-button {
    border-radius:8px;
    cursor:pointer;
  }
  .primary { border:0; background:var(--brand); color:#fff; padding:7px 9px; font-weight:650; }
  .primary:disabled { cursor:default; opacity:.55; }
  .secondary { border:1px solid var(--line); background:#fff; color:var(--ink); padding:7px 9px; }
  .link-button { border:0; background:transparent; color:var(--muted); padding:7px 4px; }
  .empty { padding:18px 14px; color:var(--muted); text-align:center; }
  .notice { margin-top:10px; padding:9px 10px; border-radius:9px; background:var(--soft); color:var(--muted); font-size:11px; display:none; }
  .notice.show { display:block; }
  .notice.error { background:#fff1f2; color:#991b1b; }
  .reconnect { width:100%; margin-top:10px; }
  .footer { display:flex; justify-content:space-between; color:var(--muted); font-size:10px; margin-top:12px; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="brand">
      <div class="brand-mark">FT</div>
      <div class="brand-copy">
        <strong>Family Tutor</strong>
        <span>ChatGPT Bridge</span>
      </div>
    </div>
    <div class="status-pill"><span id="status-dot" class="status-dot"></span><span id="status-label">Checking</span></div>
  </div>

  <div class="card">
    <div class="eyebrow">Current ChatGPT project</div>
    <div id="project-title" class="project-title">Detecting…</div>
    <div id="project-id" class="project-id"></div>
  </div>

  <div class="section-head">
    <strong>Kids</strong>
    <span id="kids-summary" class="summary">0 configured</span>
  </div>
  <div id="children" class="kids"></div>

  <div id="notice" class="notice"></div>
  <button id="connect-family" class="primary reconnect" hidden>Reconnect Family Tutor</button>

  <div class="footer">
    <span id="version">Family Tutor</span>
    <span id="recovery"></span>
  </div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
