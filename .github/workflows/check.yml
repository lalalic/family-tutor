name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix packages/integration
      - run: npm ci --prefix skills/family-tutor/mcp-server
      - run: npm ci --prefix skills/family-tutor/runtime/tutor-orchestrator
      - run: npm run check
      - run: git diff --check
