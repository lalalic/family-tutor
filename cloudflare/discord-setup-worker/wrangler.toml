name = "family-tutor-discord-setup"
main = "src/index.mjs"
compatibility_date = "2026-09-30"
workers_dev = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SetupSession"

[[durable_objects.bindings]]
name = "DISCORD_GATEWAY"
class_name = "DiscordGateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SetupSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DiscordGateway"]

[vars]
NEOY_MCP_URL = "https://neoy.qili2.com/mcp"
FAMILY_TUTOR_MCP_TOOL = "mcp.family-tutor.ingest_discord_message"
